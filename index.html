<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Ore lucrate</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#172033;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:760px;margin:auto;padding:14px 12px 36px}.top{background:#fffdf7;border:1px solid #ddd8ca;border-radius:20px;padding:18px;margin-bottom:12px}
h1{font-size:28px;margin:0}.muted{color:#667085;font-size:13px;margin:4px 0 0}.nav{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.nav button,.add{border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:#e9edf2;color:#172033}.month{font-weight:850;font-size:19px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:11px;color:#667085;font-weight:800;padding:4px}.day{min-height:76px;border:1px solid #dce1e8;background:#fff;border-radius:12px;padding:7px;text-align:left;cursor:pointer;position:relative}.day.other{opacity:.35}.num{font-weight:800}.hours{display:block;font-size:12px;margin-top:8px;font-weight:800}.pause{font-size:10px;color:#667085}.today{outline:2px solid #172033}.summary{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#fff;border:1px solid #dce1e8;border-radius:13px;padding:13px}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:#667085}
.card{background:#fff;border:1px solid #dce1e8;border-radius:17px;padding:16px;margin-top:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{margin-bottom:10px}label{font-size:12px;font-weight:800;display:block;margin-bottom:5px}input,button,select{font:inherit}input,select{width:100%;padding:11px;border:1px solid #cbd2dc;border-radius:10px;background:white}.check{display:flex;align-items:center;gap:9px;padding:11px;background:#f7f8fa;border-radius:10px}.check input{width:18px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:800}.save{background:#172033;color:#fff}.cancel{background:#eef1f5}.delete{background:#f4e9e9;color:#8b2d2d}.hidden{display:none}.footer{display:flex;gap:8px;margin-top:12px}.footer button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:750}
@media(max-width:480px){.day{min-height:67px;padding:5px}.hours{font-size:11px}.summary{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<section class="top">
<h1>⏱️ Ore lucrate</h1><p class="muted">Apasă pe o zi și notează programul. Pauza se alege separat pentru fiecare zi.</p>
<div class="nav"><button id="prev">‹</button><div class="month" id="monthTitle"></div><button id="next">›</button></div>
<div class="grid" id="calendar"></div>
<div class="summary"><div class="stat"><b id="gross">0 h</b><span>Total brut</span></div><div class="stat"><b id="net">0 h</b><span>Total net</span></div></div>
</section>

<section class="card hidden" id="editor">
<h3 id="editTitle" style="margin:0 0 12px">Adaugă zi</h3>
<div class="row">
<div class="field"><label>Data</label><input id="date" type="date"></div>
<div class="field"><label>Loc / lucrare</label><input id="place" placeholder="ex. Bekkevoort"></div>
<div class="field"><label>Început</label><input id="start" type="time"></div>
<div class="field"><label>Sfârșit</label><input id="end" type="time"></div>
</div>
<div class="check"><input id="hasPause" type="checkbox"><label for="hasPause" style="margin:0">Am avut pauză</label><input id="pause" type="number" min="0" step="5" value="30" style="width:100px;margin-left:auto" disabled><span style="font-size:12px">minute</span></div>
<div class="actions"><button class="cancel" id="cancel">Anulează</button><button class="save" id="save">Salvează</button></div>
<div class="actions"><button class="delete hidden" id="delete">Șterge ziua</button></div>
</section>

<div class="footer"><button id="export">📤 Exportă luna</button><button id="today">📅 Azi</button></div>
</div>
<script>
const KEY="ore_calendar_v1";let data=JSON.parse(localStorage.getItem(KEY)||"[]"),view=new Date(),editing=null;
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const names=["D","L","M","Mi","J","V","S"],months=["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];
function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function dur(a,b){let[x,y]=a.split(":").map(Number),[X,Y]=b.split(":").map(Number),m=X*60+Y-(x*60+y);return m<0?m+1440:m}
function net(e){return Math.max(0,dur(e.start,e.end)-(e.hasPause?+e.pause:0))}
function fmt(m){let h=Math.floor(m/60),r=m%60;return r?`${h} h ${r} min`:`${h} h`}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){
 $("monthTitle").textContent=months[view.getMonth()]+" "+view.getFullYear();
 let first=new Date(view.getFullYear(),view.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());
 let today=iso(new Date()),cells="";
 names.forEach(x=>cells+=`<div class="dow">${x}</div>`);
 for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=iso(d),e=data.find(x=>x.date===k),cl="day"+(d.getMonth()!=view.getMonth()?" other":"")+(k===today?" today":"");cells+=`<button class="${cl}" data-date="${k}"><span class="num">${d.getDate()}</span>${e?`<span class="hours">${fmt(net(e))}</span>${e.hasPause?`<span class="pause">☕ ${e.pause} min</span>`:"<span class=\"pause\">fără pauză</span>"}`:""}</button>`}
 $("calendar").innerHTML=cells;$("calendar").querySelectorAll(".day").forEach(b=>b.onclick=()=>openDay(b.dataset.date));
 let list=data.filter(e=>e.date.startsWith(`${view.getFullYear()}-${pad(view.getMonth()+1)}`)),g=list.reduce((s,e)=>s+dur(e.start,e.end),0),n=list.reduce((s,e)=>s+net(e),0);$("gross").textContent=fmt(g);$("net").textContent=fmt(n);
}
function openDay(date){
 editing=data.find(e=>e.date===date);$("editor").classList.remove("hidden");$("date").value=date;
 if(editing){$("editTitle").textContent="Editează ziua";$("start").value=editing.start;$("end").value=editing.end;$("place").value=editing.place||"";$("hasPause").checked=!!editing.hasPause;$("pause").value=editing.pause||30;$("delete").classList.remove("hidden")}
 else{$("editTitle").textContent="Adaugă ziua";$("start").value="";$("end").value="";$("place").value="";$("hasPause").checked=false;$("pause").value=30;$("delete").classList.add("hidden")}
 $("pause").disabled=!$("hasPause").checked;$("editor").scrollIntoView({behavior:"smooth",block:"start"});
}
$("hasPause").onchange=()=>{$("pause").disabled=!$("hasPause").checked};
$("save").onclick=()=>{
 let date=$("date").value,start=$("start").value,end=$("end").value;if(!date||!start||!end||dur(start,end)<=0){alert("Completează corect începutul și sfârșitul.");return}
 let e={id:editing?.id||crypto.randomUUID(),date,start,end,place:$("place").value.trim(),hasPause:$("hasPause").checked,pause:$("hasPause").checked?Number($("pause").value||0):0};
 data=data.filter(x=>x.date!==date);data.push(e);save();view=new Date(date+"T12:00:00");$("editor").classList.add("hidden");editing=null;render();
};
$("cancel").onclick=()=>{$("editor").classList.add("hidden");editing=null};
$("delete").onclick=()=>{if(editing&&confirm("Ștergi această zi?")){data=data.filter(x=>x.id!==editing.id);save();$("editor").classList.add("hidden");editing=null;render()}};
$("prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};$("next").onclick=()=>{view.setMonth(view.getMonth()+1);render()};
$("today").onclick=()=>{view=new Date();render()};
$("export").onclick=()=>{let m=`${view.getFullYear()}-${pad(view.getMonth()+1)}`,list=data.filter(e=>e.date.startsWith(m)).sort((a,b)=>a.date.localeCompare(b.date)),csv="Data,Inceput,Sfarsit,Pauza minute,Brut minute,Net minute,Loc\\n";list.forEach(e=>csv+=`${e.date},${e.start},${e.end},${e.hasPause?e.pause:0},${dur(e.start,e.end)},${net(e)},"${(e.place||"").replaceAll('"','""')}"\\n`);let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`ore-${m}.csv`;a.click()};
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));render();
</script>
</body></html>
